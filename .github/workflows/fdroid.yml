name: Deploy F-Droid Repo

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install F-Droid Server
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Create repository directories
        run: |
          mkdir -p public/repo
          mkdir -p public/metadata

      - name: Download APKs from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --limit 100 \
            --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' |
          while read -r tag; do
            echo "Downloading APKs from $tag..."

            gh release download "$tag" \
              --pattern "*.apk" \
              --dir public/repo \
              --clobber || true
          done

      - name: Create F-Droid config
        run: |
          cat > public/config.yml <<EOF
          repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo
          repo_name: "${{ github.repository_owner }} F-Droid Repo"
          repo_description: "Open-source apps delivered straight from GitHub Releases."
          EOF

      - name: Generate F-Droid index
        working-directory: public
        run: |
          fdroid update --create-metadata --verbose

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
