
name: Deploy F-Droid Repo

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install F-Droid Server
        run: |
          python -m pip install --upgrade pip
          python -m pip install fdroidserver

      - name: Create repository directories
        run: |
          mkdir -p public/repo/icons
          mkdir -p public/metadata

      - name: Download APKs from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --limit 100 \
            --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' |
          while read -r tag; do
            echo "Downloading APKs from release: $tag"

            gh release download "$tag" \
              --pattern "*.apk" \
              --dir public/repo \
              --clobber || true
          done

      - name: Create repository signing key
        working-directory: public
        env:
          FDROID_KEY_STORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$FDROID_KEY_STORE_PASS" ] || [ -z "$FDROID_KEY_PASS" ]; then
            echo "::error::FDROID_KEYSTORE_PASSWORD and FDROID_KEY_PASSWORD GitHub Secrets must be configured."
            exit 1
          fi

          if [ ! -f keystore.p12 ]; then
            keytool \
              -genkeypair \
              -alias fdroid \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -storetype PKCS12 \
              -keystore keystore.p12 \
              -storepass "$FDROID_KEY_STORE_PASS" \
              -keypass "$FDROID_KEY_PASS" \
              -dname "CN=F-Droid Repository, O=${{ github.repository_owner }}"
          fi

      - name: Create repository icon
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk"
              "+A8AAQUBAScY42YAAAAASUVORK5CYII="
          )

          Path("public/repo/icons/icon.png").write_bytes(png)
          PY

      - name: Create F-Droid configuration
        working-directory: public
        env:
          FDROID_KEY_STORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          cat > config.yml <<EOF
          repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo
          repo_name: "${{ github.repository_owner }} F-Droid Repo"
          repo_description: "Open-source apps delivered straight from GitHub Releases."
          repo_icon: "repo/icons/icon.png"
          archive_older: 0
          keystore: keystore.p12
          keystorepass: $FDROID_KEY_STORE_PASS
          keypass: $FDROID_KEY_PASS
          repo_keyalias: fdroid
          EOF

      - name: Generate F-Droid index
        working-directory: public
        env:
          FDROID_KEY_STORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          fdroid update --create-metadata --verbose

      - name: Verify generated repository
        run: |
          echo "=== Repository files ==="
          find public/repo -maxdepth 3 -type f -print

          echo
          echo "=== Metadata ==="
          find public/metadata -maxdepth 2 -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
