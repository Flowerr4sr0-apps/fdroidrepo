name: Deploy F-Droid Repo

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Releases and Generate Index
        uses: flashsoft/fdroid-repository-action@v2
        with:
          repo_name: "${{ github.repository_owner }} F-Droid Repo"
          repo_description: "Open-source apps delivered straight from GitHub Releases."
          base_url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        
