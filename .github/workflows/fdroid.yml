name: Deploy F-Droid Repo

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install F-Droid Server
        run: |
          python -m pip install --upgrade pip
          python -m pip install fdroidserver

      - name: Create repository structure
        run: |
          mkdir -p public/repo/icons
          mkdir -p public/metadata

      - name: Download APKs from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --limit 100 \
            --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' |
          while read -r tag; do
            echo "Downloading APKs from $tag..."

            gh release download "$tag" \
              --pattern "*.apk" \
              --dir public/repo \
              --clobber || true
          done

      - name: Create F-Droid signing key
        working-directory: public
        run: |
          if [ ! -f keystore.p12 ]; then
            echo "Creating F-Droid signing key..."
            fdroid update --create-key
          else
            echo "F-Droid signing key already exists."
          fi

      - name: Create repository icon
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk"
              "+A8AAQUBAScY42YAAAAASUVORK5CYII="
          )

          Path("public/repo/icons/icon.png").write_bytes(png)
          PY

      - name: Create F-Droid configuration
        working-directory: public
        run: |
          cat > config.yml <<EOF
          repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo
          repo_name: "${{ github.repository_owner }} F-Droid Repo"
          repo_description: "Open-source apps delivered straight from GitHub Releases."
          repo_icon: "repo/icons/icon.png"
          archive_older: 0
          keystore: keystore.p12
          keystorepass: ""
          keypass: ""
          repo_keyalias: fdroid
          EOF

      - name: Generate F-Droid index
        working-directory: public
        run: |
          fdroid update --create-metadata --verbose

      - name: Verify repository
        run: |
          echo "Generated repository:"
          find public -maxdepth 4 -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
