name: Deploy F-Droid Repo

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install F-Droid Server
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Create repository structure
        run: |
          mkdir -p public/repo
          mkdir -p public/metadata

      - name: Download APKs from GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false) | .tagName' |
          while read -r tag; do
            echo "Downloading APKs from release: $tag"

            gh release download "$tag" \
              --pattern "*.apk" \
              --dir public/repo \
              --clobber || true
          done

      - name: Create F-Droid configuration
        run: |
          cat > public/config.yml <<EOF
          repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo
          repo_name: "${{ github.repository_owner }} F-Droid Repo"
          repo_description: "Open-source apps delivered straight from GitHub Releases."

          archive_older: 0

          keystore: ../keystore.p12
          keystorepass: "${{ secrets.FDROID_KEYSTORE_PASSWORD }}"
          keypass: "${{ secrets.FDROID_KEY_PASSWORD }}"
          repo_keyalias: fdroid
          EOF

      - name: Import signing keystore
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$FDROID_KEYSTORE_BASE64" | base64 --decode > keystore.p12

      - name: Generate F-Droid repository index
        run: |
          cd public
          fdroid update --create-metadata --verbose

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
